[package]
authors = [ "Dylan" ]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "Tree-sitter grammar for EU4 modding, covering txt, yml, gfx, and gui files"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "eu4mod" ]
license = "MIT"
name = "tree-sitter-eu4mod"
readme = "README.md"
repository = "https://github.com/tree-sitter/tree-sitter-eu4mod"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "queries/*", "src/*", "tree-sitter.json", "/LICENSE" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.0"
